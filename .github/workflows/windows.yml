name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm --workspace @modus/desktop run build
      - run: npm --workspace @modus/desktop run test:smoke
      - run: npm --workspace @modus/desktop run package:win -- --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mylo-windows-installer
          path: apps/desktop/dist/*Setup.exe
          if-no-files-found: error
