name: Windows installer
on:
  workflow_dispatch:
    inputs:
      verify_wsl:
        description: Run isolation tests on a self-hosted Windows x64 runner labeled mylo-wsl2
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm --workspace @modus/desktop run typecheck
      - run: cargo test --workspace
      - run: npm --workspace @modus/desktop run build
      - run: npm --workspace @modus/desktop run test:smoke
      - run: npm --workspace @modus/desktop run package:win -- --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mylo-windows-installer
          path: apps/desktop/dist/*Setup.exe
          if-no-files-found: error
  wsl-isolation:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_wsl
    runs-on: [self-hosted, Windows, X64, mylo-wsl2]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npx vitest run apps/desktop/src/main/harness/windows-sandbox.live.test.ts
        env:
          MYLO_WSL_TESTS: "1"
